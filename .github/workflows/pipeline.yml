name: news-pipeline

on:
  schedule:
    # 备份触发：平时由 Cloudflare Worker 的 Cron Trigger 每 30 分钟调用 workflow_dispatch（准点、不会被停用）。
    # 这里每 6 小时兜底一次，防止 Worker 或 GITHUB_TOKEN 出问题时流水线完全停掉。
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "要跑的阶段"
        type: choice
        options: [all, fetch, score, merge, digest, push, weekly, prune]
        default: all
      force_digest:
        description: "立即生成并发送日报"
        type: boolean
        default: false
      force_weekly:
        description: "立即生成并发送周报"
        type: boolean
        default: false
      manual:
        description: "手动运行：忽略免打扰和合集间隔，跑完在 Telegram 回报结果（Telegram 的 /run 会自动勾上）"
        type: boolean
        default: false

# 同一时间只跑一个，后来的排队，避免并发写库
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run pipeline
        id: run
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 以下可在仓库 Settings → Secrets and variables → Actions → Variables 里设置，
          # 不设就用代码默认值（见 .env.example）。改了下次运行就生效，不用推送代码
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}
          SIMHASH_DISTANCE: ${{ vars.SIMHASH_DISTANCE }}
          SIMHASH_WINDOW_HOURS: ${{ vars.SIMHASH_WINDOW_HOURS }}
          MAX_SCORE_BATCHES: ${{ vars.MAX_SCORE_BATCHES }}
          PUSH_THRESHOLD: ${{ vars.PUSH_THRESHOLD }}
          PUSH_MAX_PER_RUN: ${{ vars.PUSH_MAX_PER_RUN }}
          PUSH_MAX_AGE_HOURS: ${{ vars.PUSH_MAX_AGE_HOURS }}
          DIGEST_HOUR_MYT: ${{ vars.DIGEST_HOUR_MYT }}
          WATCH_MIN_SCORE: ${{ vars.WATCH_MIN_SCORE }}
          PUSH_INSTANT_MIN: ${{ vars.PUSH_INSTANT_MIN }}
          BUNDLE_INTERVAL_HOURS: ${{ vars.BUNDLE_INTERVAL_HOURS }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          CLEANUP_AFTER_HOURS: ${{ vars.CLEANUP_AFTER_HOURS }}
          WEEKLY_HOUR_MYT: ${{ vars.WEEKLY_HOUR_MYT }}
        run: |
          set +e
          args="${{ inputs.stage || 'all' }}"
          if [ "${{ inputs.force_digest }}" = "true" ]; then args="$args --force-digest"; fi
          if [ "${{ inputs.force_weekly }}" = "true" ]; then args="$args --force-weekly"; fi
          if [ "${{ inputs.manual }}" = "true" ]; then args="$args --manual"; fi
          python -m nma $args
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # 兜底告警：安装依赖失败、Python 崩溃等程序自己没来得及告警的情况
      # （退出码 2 表示程序已经发过告警，这里不重复发）
      - name: Alert on unexpected failure
        if: failure() && steps.run.outputs.code != '2'
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ News pipeline 运行失败（未捕获错误）：${RUN_URL}"
