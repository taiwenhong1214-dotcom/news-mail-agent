# 信源配置（基线）。对话里 add_feed 加的源存在 D1 的 config_feeds 表，运行时合并。
#
# tier: T1 = 高质量 / 一手信源，打分时作为参考信号，同分时优先；T2 = 补充源
# url 也可以写成 "rsshub:/路由"，会拼到 rsshub_base 后面（公共 rsshub.app 限流严重，建议自建或换镜像）
# Google News 搜索 RSS 用来补没有原生 RSS 的领域，q= 后面写查询词，when:2d 限定时间

rsshub_base: https://rsshub.app

groups:
  devops:
    name: DevOps
    feeds:
      - { name: The New Stack, url: "https://thenewstack.io/feed/", tier: T1 }
      - { name: InfoQ DevOps, url: "https://feed.infoq.com/devops/", tier: T1 }
      - { name: GitHub Blog, url: "https://github.blog/feed/", tier: T2 }
      # 安全事件和漏洞（供应链攻击、CVE、勒索），DevOps 必看
      - { name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/", tier: T1 }
      - { name: HashiCorp Blog, url: "https://www.hashicorp.com/blog/feed.xml", tier: T2 }
      # 中文：国内大厂的架构 / 运维实践，和英文源互补
      - { name: InfoQ 中文, url: "https://www.infoq.cn/feed.xml", tier: T1 }

  cloud-native:
    name: 云原生
    feeds:
      - { name: Kubernetes Blog, url: "https://kubernetes.io/feed.xml", tier: T1 }
      - { name: Google Cloud Blog, url: "https://cloudblog.withgoogle.com/rss/", tier: T2 }
      - { name: "Google News: cloud native", url: "https://news.google.com/rss/search?q=(Kubernetes+OR+CNCF+OR+%22cloud+native%22)+when:2d&hl=en-US&gl=US&ceid=US:en", tier: T2 }
      - { name: AWS News Blog, url: "https://aws.amazon.com/blogs/aws/feed/", tier: T1 }
      - { name: Cloudflare Blog, url: "https://blog.cloudflare.com/rss/", tier: T2 }
      - { name: Azure Updates, url: "https://www.microsoft.com/releasecommunications/api/v2/azure/rss", tier: T2 }

  ai-infra:
    name: AI 基础设施
    feeds:
      # AIHOT：中文 AI 资讯精选（个人非商业使用免费）；original_link 取摘要里的原文链接
      - { name: AIHOT, url: "https://aihot.news/feed.xml", tier: T1, original_link: true }
      - { name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", tier: T1 }
      - { name: SemiAnalysis, url: "https://newsletter.semianalysis.com/feed", tier: T1 }
      - { name: Simon Willison, url: "https://simonwillison.net/atom/everything/", tier: T1 }
      - { name: NVIDIA Technical Blog, url: "https://developer.nvidia.com/blog/feed", tier: T2 }
      # 大厂一手发布 + 英文 AI 行业新闻（AIHOT 是中文精选，两边互补）
      - { name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", tier: T1 }
      - { name: OpenAI News, url: "https://openai.com/news/rss.xml", tier: T1 }
      - { name: The Decoder, url: "https://the-decoder.com/feed/", tier: T2 }
      - { name: 量子位, url: "https://www.qbitai.com/feed", tier: T2 }

  my-jobs:
    name: 大马科技招聘
    feeds:
      - { name: "Google News: MY tech hiring", url: "https://news.google.com/rss/search?q=Malaysia+(tech+OR+IT+OR+software)+(hiring+OR+jobs+OR+talent+OR+layoffs)+when:2d&hl=en-MY&gl=MY&ceid=MY:en", tier: T2 }
      - { name: "Google News: MY data centre jobs", url: "https://news.google.com/rss/search?q=Malaysia+(%22data+centre%22+OR+%22data+center%22+OR+semiconductor)+(jobs+OR+hiring+OR+investment)+when:2d&hl=en-MY&gl=MY&ceid=MY:en", tier: T2 }
      # 东南亚科技创投；靠分组白名单只留招聘 / 裁员 / 投资相关的
      - { name: Tech in Asia, url: "https://www.techinasia.com/feed", tier: T2 }

  my-it:
    name: 大马 IT
    feeds:
      - { name: SoyaCincau, url: "https://soyacincau.com/feed/", tier: T1 }
      - { name: Lowyat.NET, url: "https://www.lowyat.net/feed/", tier: T2 }
      - { name: Vulcan Post, url: "https://vulcanpost.com/feed/", tier: T2 }
      # 中文：中国媒体报道的大马科技 / 数据中心 / 半导体投资（中资企业落地大马的消息英文源常常没有）
      - { name: "Google News: 大马科技（中文）", url: "https://news.google.com/rss/search?q=%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A+(%E6%95%B0%E6%8D%AE%E4%B8%AD%E5%BF%83+OR+%E5%8D%8A%E5%AF%BC%E4%BD%93+OR+%E7%A7%91%E6%8A%80+OR+%E6%95%B0%E5%AD%97%E7%BB%8F%E6%B5%8E)+when:2d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", tier: T2 }

  my-local:
    name: 大马本地
    feeds:
      - { name: Free Malaysia Today, url: "https://www.freemalaysiatoday.com/feed/", tier: T1 }
      - { name: Malay Mail, url: "https://www.malaymail.com/feed/rss/malaysia", tier: T2 }
      - { name: 当今大马, url: "https://www.malaysiakini.com/rss/zh/news.rss", tier: T2 }
      - { name: Malaysiakini, url: "https://www.malaysiakini.com/en/rss/news.rss", tier: T1 }
      # 国家通讯社：官方声明、政策快讯。HTTP 头和 XML 声明的编码不一致，靠 fetch.py 传 Content-Type 解决
      - { name: Bernama, url: "https://www.bernama.com/en/rssfeed.php", tier: T2 }
      # 大马华文报都没有 RSS，经 Google News 取。只取东方日报「国内」栏目（约 50 条/天）；
      # 星洲 / 南洋 / 中国报全站每家都超过 100 条/天，而且和上面的英文源大量重复
      - { name: "东方日报 国内", url: "https://news.google.com/rss/search?q=site:orientaldaily.com.my/news/nation+when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", tier: T2 }

  world:
    name: 国际
    feeds:
      - { name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", tier: T1 }
      - { name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", tier: T2 }
      - { name: CNA Asia, url: "https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6511", tier: T1 }
      - { name: BBC 中文, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", tier: T1 }
      - { name: DW 中文, url: "https://rss.dw.com/rdf/rss-chi-all", tier: T2 }

  trends:
    name: 世界趋势
    feeds:
      - { name: Hacker News 200+, url: "https://hnrss.org/frontpage?points=200", tier: T1 }
      - { name: MIT Technology Review, url: "https://www.technologyreview.com/feed/", tier: T1 }
      - { name: Rest of World, url: "https://restofworld.org/feed/latest/", tier: T1 }
      - { name: The Register, url: "https://www.theregister.com/headlines.atom", tier: T2 }
      # 中文科技：36氪（创投 / 公司）、爱范儿（消费科技）、蓝点网（软件 / 互联网）
      - { name: 36氪, url: "https://www.36kr.com/feed", tier: T2 }
      - { name: 爱范儿, url: "https://www.ifanr.com/feed", tier: T2 }
      - { name: 蓝点网, url: "https://www.landiannews.com/feed", tier: T2 }

  finance:
    name: 金融
    feeds:
      - { name: CNBC Top News, url: "https://www.cnbc.com/id/100003114/device/rss/rss.html", tier: T1 }
      - { name: Malay Mail Money, url: "https://www.malaymail.com/feed/rss/money", tier: T2 }
      - { name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", tier: T1 }
      - { name: FT中文网, url: "https://www.ftchinese.com/rss/news", tier: T2 }
      - { name: "联合早报 财经", url: "https://news.google.com/rss/search?q=site:zaobao.com.sg/finance+when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", tier: T2 }

  stocks:
    name: 马股美股科技
    feeds:
      - { name: CNBC Technology, url: "https://www.cnbc.com/id/19854910/device/rss/rss.html", tier: T1 }
      - { name: "Google News: Bursa tech stocks", url: "https://news.google.com/rss/search?q=Bursa+Malaysia+(technology+OR+tech+OR+semiconductor)+stocks+when:2d&hl=en-MY&gl=MY&ceid=MY:en", tier: T2 }
      - { name: "Google News: 马股（中文）", url: "https://news.google.com/rss/search?q=%E9%A9%AC%E8%82%A1+when:2d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans", tier: T2 }
      # 只要主流财经媒体：不加 site: 限制时，一半以上是美国地方台和转载站
      - { name: "Google News: US tech stocks", url: "https://news.google.com/rss/search?q=(Nvidia+OR+Microsoft+OR+Apple+OR+Alphabet+OR+Amazon+OR+Meta+OR+Tesla)+stock+(site:reuters.com+OR+site:cnbc.com+OR+site:bloomberg.com+OR+site:wsj.com+OR+site:ft.com)+when:1d&hl=en-US&gl=US&ceid=US:en", tier: T2 }

  games:
    name: 游戏
    # 只要大作、争议、爆款和行业大事：靠 score.md 的游戏规则压分，filters.yaml 的 block_title 挡攻略 / 折扣 / 栏目。
    # 没选 IGN / Kotaku（影视八卦和折扣多）、PC Gamer / Eurogamer（评论和盘点多）
    feeds:
      # 行业：裁员、收购、财报、销量、监管、平台政策
      - { name: GamesIndustry.biz, url: "https://www.gamesindustry.biz/feed", tier: T1 }
      - { name: Game Developer, url: "https://www.gamedeveloper.com/rss.xml", tier: T1 }
      # 主流游戏新闻
      - { name: VGC, url: "https://www.videogameschronicle.com/feed/", tier: T2 }
      - { name: GameSpot News, url: "https://www.gamespot.com/feeds/news/", tier: T2 }
      - { name: The Verge Games, url: "https://www.theverge.com/rss/games/index.xml", tier: T2 }
